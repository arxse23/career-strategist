[server]
enableStaticServing = true

[[theme.fontFaces]]
family = "DMSans"
url = "app/static/DMSans-Regular.ttf"
style = "normal"
weight = 400

[[theme.fontFaces]]
family = "DMSans"
url = "app/static/DMSans-Medium.ttf"
style = "normal"
weight = 500

[[theme.fontFaces]]
family = "DMSans"
url = "app/static/DMSans-SemiBold.ttf"
style = "normal"
weight = 600

[[theme.fontFaces]]
family = "DMSans"
url = "app/static/DMSans-Bold.ttf"
style = "normal"
weight = 700

[[theme.fontFaces]]
family = "FiraCode"
url = "app/static/FiraCode-Regular.ttf"
style = "normal"
weight = 400

[[theme.fontFaces]]
family = "FiraCode"
url = "app/static/FiraCode-Medium.ttf"
style = "normal"
weight = 500

[theme]
# CASE FILE — same palette as the Gumroad landing page, so the whole funnel matches
primaryColor = "#B03A2E"             # Stamp red — buttons, active states
backgroundColor = "#EFE7D2"          # Kraft paper — reads as a document, not a SaaS dashboard
secondaryBackgroundColor = "#DED2B0" # Deeper kraft — widgets, sidebar
textColor = "#20242B"                # Charcoal ink
linkColor = "#8F2E24"                # Darker stamp red, readable on paper
borderColor = "#A79B7A"              # Muted kraft-brown hairline
baseRadius = "0.15rem"               # Near-square corners — document, not app-icon rounding
font = "DMSans"
headingFont = "DMSans"
codeFont = "FiraCode"
codeBackgroundColor = "#E3D7B8"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#DED2B0"
secondaryBackgroundColor = "#CFC29B"